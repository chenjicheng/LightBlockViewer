name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build -Pmod_version="${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LightBlockViewer ${{ github.ref_name }}
          body: |
            ## LightBlockViewer ${{ steps.version.outputs.version }}

            Minecraft 1.21.11 Fabric 模组 — 让生存模式玩家可以看到、交互、调整亮度和破坏光源方块。

            ### 需要
            - Minecraft 1.21.11
            - Fabric Loader >=0.18.2
            - Fabric API

            ### 安装
            将 `.jar` 文件放入 `.minecraft/mods/` 目录。
          files: |
            build/libs/lightblockviewer-${{ steps.version.outputs.version }}.jar
          generate_release_notes: true
          draft: false
          prerelease: false
